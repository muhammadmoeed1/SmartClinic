name: Keep-Alive

# Koyeb's free instance scales to zero after 1 hour of inactivity, causing a
# slow cold start on the next request and pausing in-process cron jobs
# (@nestjs/schedule appointment reminders) while asleep. This pings the health
# endpoint every 14 minutes so the live demo stays warm for anyone who clicks
# the link, and reminders keep firing.
#
# Setup: add a repository variable BACKEND_URL (Settings → Secrets and variables
# → Actions → Variables) set to your Koyeb URL, e.g. https://smartclinic-api.koyeb.app
# If BACKEND_URL is not set, the job no-ops quietly.

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL not configured — skipping keep-alive."
            exit 0
          fi
          echo "Pinging $BACKEND_URL/health"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BACKEND_URL/health" || echo "000")
          echo "HTTP $code"
